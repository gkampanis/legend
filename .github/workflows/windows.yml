name: Windows tests and standalone build
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
            requirements-build.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test source on Windows
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m myinvoices --check-demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build including Chromium
        run: python tools/build_windows.py
      - name: Smoke test packaged application
        run: ./tools/smoke_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: myInvoices-Windows-x64
          path: dist/myInvoices/
          if-no-files-found: error

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myinvoices-starter"
version = "0.2.0"
description = "Local Greek desktop starter with offline-tested myDATA synchronization"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
myinvoices = "myinvoices.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
